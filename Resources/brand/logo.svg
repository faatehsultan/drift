<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="85%">
      <stop offset="0" stop-color="#2A1B5E"/>
      <stop offset="0.45" stop-color="#120D2B"/>
      <stop offset="1" stop-color="#06050C"/>
    </radialGradient>
    <linearGradient id="wave" x1="192" y1="0" x2="832" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FE3FF"/>
      <stop offset="0.5" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#FF5FA8"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="250" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9C7BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9C7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <ellipse cx="512" cy="250" rx="320" ry="240" fill="url(#glow)"/>

    <!-- the notch -->
    <path d="M 352 100 Q 372 100 372 120 L 372 168 Q 372 222 426 222 L 598 222 Q 652 222 652 168 L 652 120 Q 652 100 672 100 Z" fill="#000"/>
    <circle cx="512" cy="160" r="13" fill="#15122A"/>
    <circle cx="512" cy="160" r="5" fill="#3B3470"/>

    <!-- sound drifting out of the notch: glow layer -->
    <g filter="url(#blur)" opacity="0.85">
      <path d="M 192 470 c 50 -70 110 -70 160 0 s 110 70 160 0 s 110 -70 160 0 s 110 70 160 0" fill="none" stroke="url(#wave)" stroke-width="40" stroke-linecap="round"/>
      <path d="M 232 600 c 45 -52 95 -52 140 0 s 95 52 140 0 s 95 -52 140 0 s 95 52 140 0" fill="none" stroke="url(#wave)" stroke-width="32" stroke-linecap="round"/>
    </g>
    <!-- sharp layer -->
    <path d="M 192 470 c 50 -70 110 -70 160 0 s 110 70 160 0 s 110 -70 160 0 s 110 70 160 0" fill="none" stroke="url(#wave)" stroke-width="36" stroke-linecap="round"/>
    <path d="M 232 600 c 45 -52 95 -52 140 0 s 95 52 140 0 s 95 -52 140 0 s 95 52 140 0" fill="none" stroke="url(#wave)" stroke-width="28" stroke-linecap="round" opacity="0.8"/>
    <path d="M 282 718 c 38 -34 77 -34 115 0 s 77 34 115 0 s 77 -34 115 0 s 77 34 115 0" fill="none" stroke="url(#wave)" stroke-width="20" stroke-linecap="round" opacity="0.5"/>

    <!-- drifting particles -->
    <circle cx="300" cy="812" r="9" fill="#4FE3FF" opacity="0.55"/>
    <circle cx="728" cy="790" r="7" fill="#FF5FA8" opacity="0.5"/>
    <circle cx="560" cy="838" r="5" fill="#8B6CFF" opacity="0.6"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="url(#rim)" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
