name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Needs the macOS 26 SDK (Liquid Glass APIs). If this runner label isn't
    # available yet, switch to macos-latest with an Xcode 26 selected.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}

      - name: Build Drift.app
        run: ./build.sh

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/Drift.app Drift-ci.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Drift-${{ github.sha }}
          path: Drift-ci.zip
