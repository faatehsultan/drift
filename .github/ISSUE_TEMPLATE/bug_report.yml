name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Hover the notch
        2. Open Music → Search
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Drift version
      description: Settings → General → About
      placeholder: 1.0.0 (build 1)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Pro M3
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or recording
      description: Drag images or a short screen recording here if it helps.
